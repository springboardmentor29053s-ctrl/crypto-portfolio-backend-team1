# ???????????????????????????????????????????????????????????????
# Spring Configuration
# ???????????????????????????????????????????????????????????????

spring.application.name=cryptoPortfolio

# ???????????????????????????????????????????????????????????????
# Database Configuration
# ???????????????????????????????????????????????????????????????

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=postgres
spring.datasource.password=${PostgreSql}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true

# ???????????????????????????????????????????????????????????????
# JWT Configuration
# ???????????????????????????????????????????????????????????????

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.encryption.secret=${ENC_KEY}

# Etherscan API key (free tier at https://etherscan.io/apis)
etherscan.api.key=${EtherScan}

# CryptoScamDB ? no key needed, free public API
# https://api.cryptoscamdb.org/v1/check/{address}

# ???????????????????????????????????????????????????????????????
# Task Scheduling
# ???????????????????????????????????????????????????????????????

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=crypto-scheduler-

# ???????????????????????????????????????????????????????????????
# Logging Configuration
# ???????????????????????????????????????????????????????????????

logging.level.root=INFO
logging.level.com.crypto.cryptoPortfolio=DEBUG
logging.level.org.springframework.security=DEBUG

logging.file.name=logs/crypto-portfolio.log
logging.file.max-size=10MB
logging.file.max-history=10

# ???????????????????????????????????????????????????????????????
# Mail Configuration (SMTP)
# ???????????????????????????????????????????????????????????????

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${Mail_Name}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notification.from=${Mail_Name}
app.notification.enabled=true

