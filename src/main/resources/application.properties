# If port 8080 is busy, try 8081. Note: Update frontend API URL if changed.
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_portfolio?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=4567
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Performance: Close DB session after transaction finishes
spring.jpa.open-in-view=false
# Prevent LiveReload port conflicts
spring.devtools.livereload.enabled=false

jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000


# API Keys for External Services
etherscan.api.key=YourEtherscanApiKeyHere
cryptoscamb.api.key=YourCryptoScamDBApiKeyHere

